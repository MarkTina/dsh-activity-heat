<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Recent activity heat">
  <title>Recent activity heat — a hot session dot marking the most recent row</title>
  <defs>
    <radialGradient id="ah-heat-glow" cx="20.5" cy="27.2" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="0.62" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 白色系圆角底：干净、浅色界面友好，蓝色只承担“热度”这一件事 -->
  <rect width="64" height="64" rx="15" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none"
        stroke="#0f172a" stroke-opacity="0.10" stroke-width="0.9"/>

  <!-- 热度圆点：极淡的同色热晕 + 脉冲环 + 实心点（对应侧栏标题前的活跃圆点） -->
  <circle cx="20.5" cy="27.2" r="12" fill="url(#ah-heat-glow)"/>
  <circle cx="20.5" cy="27.2" r="9.2" fill="none" stroke="#3b82f6" stroke-opacity="0.345" stroke-width="1.5"/>
  <circle cx="20.5" cy="27.2" r="4.9" fill="#3b82f6"/>

  <!-- 三条会话行：长度与深浅递减，圆点正对最上（最近活跃）的一行 -->
  <rect x="33.5" y="25.8" width="21" height="3.6" rx="1.8" fill="#334155" fill-opacity="0.92"/>
  <rect x="33.5" y="33.8" width="15.5" height="3.6" rx="1.8" fill="#64748b" fill-opacity="0.67"/>
  <rect x="33.5" y="41.8" width="10.5" height="3.6" rx="1.8" fill="#94a3b8" fill-opacity="0.43"/>
</svg>
